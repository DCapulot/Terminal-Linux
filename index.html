const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function carregar(id) {
  return DOCS[id] || "# Capítulo não encontrado";
}

function menu() {
  $("#side").innerHTML = '<a href="#inicio" data-id="inicio">Início</a>' + CAPS.map(
    ([id, t]) => `<a href="#${id}" data-id="${id}">${esc(t)}</a>`
  ).join("");
}

function copiar(pre) {
  const b = document.createElement("button");
  b.className = "copy";
  b.textContent = "Copiar";
  b.onclick = async () => {
    try {
      await navigator.clipboard.writeText(pre.querySelector("code").innerText);
      b.textContent = "Copiado";
    } catch (e) {
      b.textContent = "Erro ao copiar";
    }
    setTimeout(() => (b.textContent = "Copiar"), 1500);
  };
  pre.append(b);
}

function ajustarLinks(id) {
  content.querySelectorAll("a[href]").forEach((a) => {
    const h = a.getAttribute("href");
    if (/^https?:/.test(h)) {
      a.target = "_blank";
      a.rel = "noopener";
    } else if (h.startsWith("#")) {
      a.href = `#${id}/${h.slice(1)}`;
    } else if (h.includes(".md")) {
      const [arq, ancora] = h.split("#");
      a.href = `#${arq.replace(/^.*\//, "").replace(".md", "")}${ancora ? "/" + ancora : ""}`;
    }
  });
}

async function mostrar(id) {
  content.innerHTML = marked.parse(await carregar(id));
  content.querySelectorAll("h2").forEach((h) => (h.id = slug(h.textContent)));
  content.querySelectorAll("pre").forEach(copiar);
  content.querySelectorAll("table").forEach((t) => {
    const d = document.createElement("div");
    d.className = "scroll";
    t.replaceWith(d);
    d.append(t);
  });
  ajustarLinks(id);
  document.querySelectorAll("#side a").forEach((a) => {
    a.toggleAttribute("aria-current", a.dataset.id === id);
  });
  const i = CAPS.findIndex((c) => c[0] === id);
  const ant = CAPS[i - 1], prox = CAPS[i + 1];
  $("#pager").innerHTML =
    (ant ? `<a href="#${ant[0]}"><small>Anterior</small>${esc(ant[1])}</a>` : "") +
    (prox ? `<a href="#${prox[0]}"><small>Próximo</small>${esc(prox[1])}</a>` : "");
  document.title = `${CAPS[i][1]} · Linux Terminal`;
  atual = id;
}

async function inicio() {
  const idx = await montarIndice();
  const cards = CAPS.map(([id, t]) => {
    const cs = idx.filter((x) => x.id === id && x.resumo);
    return `<a class="card" href="#${id}"><b>${esc(t)}</b><small>${cs.length} tópicos</small><span>${cs.slice(0, 7).map((x) => `<code>${esc(x.nome)}</code>`).join(" ")}</span></a>`;
  }).join("");
  content.innerHTML = `<h1>Linux Terminal</h1><p>Guia em português dos comandos do terminal Linux, da navegação às redes. Escolha um capítulo ou busque um comando.</p><div class="cards">${cards}</div>`;
  document.querySelectorAll("#side a").forEach((a) => a.toggleAttribute("aria-current", a.dataset.id === "inicio"));
  $("#pager").innerHTML = "";
  document.title = "Linux Terminal · guia de comandos em português";
  atual = "inicio";
}

async function rota() {
  const [id0, ancora] = decodeURIComponent(location.hash.slice(1)).split("/");
  const id = CAPS.some((c) => c[0] === id0) ? id0 : "inicio";
  if (id !== atual) await (id === "inicio" ? inicio() : mostrar(id));
  const alvo = ancora && [...content.querySelectorAll("h2")].find((h) => igual(h.id, ancora));
  alvo ? alvo.scrollIntoView() : window.scrollTo(0, 0);
  document.body.classList.remove("nav-open");
}

async function montarIndice() {
  if (indice) return indice;
  indice = [];
  for (const [id, titulo] of CAPS) {
    const md = await carregar(id);
    md.split(/\n(?=## )/).slice(1).forEach((sec) => {
      const nome = sec.match(/^## (.+)/)[1].replace(/`/g, "");
      const resumo = (sec.match(/\*\*Para que serve:\*\*\s*(.+)/) || ["", ""])[1].replace(/[`*]/g, "");
      indice.push({ id, titulo, nome, resumo, ancora: slug(nome), texto: (nome + " " + sec).toLowerCase() });
    });
  }
  return indice;
}

async function buscar() {
  const q = $("#q").value.toLowerCase().trim();
  const lista = $("#res");
  if (!q) return (lista.hidden = true);
  const achados = (await montarIndice())
    .filter((x) => x.texto.includes(q))
    .sort((a, b) => b.nome.toLowerCase().includes(q) - a.nome.toLowerCase().includes(q))
    .slice(0, 8);
  lista.innerHTML = achados.length
    ? achados.map((x) => `<li><a href="#${x.id}/${x.ancora}"><b>${esc(x.nome)}</b><small>${esc(x.titulo)}${x.resumo ? " · " + esc(x.resumo.slice(0, 80)) : ""}</small></a></li>`).join("")
    : "<li><a>Nenhum comando encontrado. Tente outro termo.</a></li>";
  lista.hidden = false;
}

$("#q").addEventListener("input", buscar);
$("#res").addEventListener("click", () => {
  $("#res").hidden = true;
  $("#q").value = "";
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("#q")) {
    e.preventDefault();
    $("#q").focus();
  } else if (e.key === "Escape") {
    $("#res").hidden = true;
    $("#q").blur();
  }
});
$("#menu").onclick = () => document.body.classList.toggle("nav-open");
$("#theme").onclick = () => {
  const r = document.documentElement;
  const escuro = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = escuro ? "light" : "dark";
  try { localStorage.setItem("tema", r.dataset.theme); } catch (e) {}
};
window.addEventListener("hashchange", rota);
menu();
rota();
</script>
</body>
